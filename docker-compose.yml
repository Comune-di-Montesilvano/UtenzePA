services:
  api:
    container_name: montesilvano-be-apis
    build:
      context: ./backend
      target: development
    environment:
      # Node Environment
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3000}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - APP_NAME=${APP_NAME:-NestJS Template}
      # MongoDB
      - MONGODB_URI=mongodb://montesilvano-be-apis-mongodb:27017/nestjs_template
      # MySQL
      - MYSQL_HOST=montesilvano-be-apis-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DB=mydatabase
      # JWT (will be loaded from Infisical if available)
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-abracadabra}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_EXPIRATION=7d
      # Security
      - BCRYPT_ROUNDS=12
      - MAX_FAILED_LOGIN_ATTEMPTS=5
      - ACCOUNT_LOCK_DURATION_MS=1800000
      - PASSWORD_RESET_TOKEN_EXPIRATION_MS=3600000
      - EMAIL_VERIFICATION_TOKEN_EXPIRATION_MS=86400000
      # 2FA
      - TWO_FACTOR_APP_NAME=NestJS Template
      - TWO_FACTOR_WINDOW=2
      # Swagger
      - SWAGGER=true
    user: "1000:1000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '${DOCKER_API_PORT:-3000}:3000'
      - '${DOCKER_API_DEBUG_PORT:-9229}:9229'
    networks:
      - montesilvano-network
    restart: always
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    container_name: montesilvano-be-apis-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DB:-mydatabase}
    ports:
      - '${DOCKER_MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - montesilvano-network
    command: --skip-log-bin
    logging:
      driver: none

  frontend:
    build:
      context: ./frontend
    container_name: montesilvano-fe
    ports:
      - "${DOCKER_FRONTEND_PORT:-4300}:80"
    networks:
      - montesilvano-network

volumes:
  node_modules:
  mysql:

networks:
  montesilvano-network:
    driver: bridge
