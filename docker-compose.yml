name: utenzepa

# PRODUZIONE (registry/Portainer): immagini da GHCR, solo volumi named,
# nessun bind mount, nessuna porta di debug esposta. Per lo sviluppo vedi
# docker-compose.override.yml (attivato da COMPOSE_FILE in .env).

services:

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD obbligatorio - genera con openssl rand -hex 24}
      MYSQL_DATABASE: ${MYSQL_DB:-mydatabase}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - utenzepa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/comune-di-montesilvano/utenzepa-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # MySQL
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD obbligatorio - genera con openssl rand -hex 24}
      - MYSQL_DB=${MYSQL_DB:-mydatabase}
      # Secret (obbligatori)
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET obbligatorio - genera con openssl rand -hex 32}
      - COOKIE_SECRET=${COOKIE_SECRET:?COOKIE_SECRET obbligatorio - genera con openssl rand -hex 32}
      # Email (invio notifiche/reset password)
      - HOST_EMAIL=${HOST_EMAIL:-}
      - PORT_EMAIL=${PORT_EMAIL:-587}
      - USERNAME_EMAIL=${USERNAME_EMAIL:-}
      - PASSWORD_EMAIL=${PASSWORD_EMAIL:-}
      - SMTP_SECURE_PROTOCOL=${SMTP_SECURE_PROTOCOL:-true}
      # Swagger — mai true in produzione pubblica
      - SWAGGER=${SWAGGER:-false}
    ports:
      - '${DOCKER_API_PORT:-3000}:3000'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - utenzepa-network

  frontend:
    image: ghcr.io/comune-di-montesilvano/utenzepa-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${DOCKER_FRONTEND_PORT:-4300}:80'
    depends_on:
      - api
    networks:
      - utenzepa-network

volumes:
  mysql_data:

networks:
  utenzepa-network:
    driver: bridge
