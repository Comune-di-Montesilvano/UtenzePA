description:
  it:
    localisedName: UtenzePA
    shortDescription: >-
      Gestionale per il patrimonio, le utenze, i fornitori e le fatture
      del Comune di Montesilvano.
    longDescription: >-
      UtenzePA consente all'ente di gestire il patrimonio immobiliare
      (asset), le utenze e i relativi contratti, i fornitori e le fatture
      collegate, con aggregatori e capitoli di bilancio associati. Un
      backend REST (NestJS) espone le risorse di dominio, un frontend
      Angular fornisce l'interfaccia operativa per gli utenti di sistema.


      L'autenticazione degli operatori è basata su JWT (solo access
      token) con password con hashing bcrypt; il reset password e il
      bootstrap del primo Admin usano un OTP inviato via email.


      Lo stack gira interamente in Docker (backend NestJS, frontend
      Angular/nginx, MySQL), senza dipendenze da servizi cloud esterni.
    features:
      - Gestione patrimonio immobiliare (asset e aggregatori)
      - Gestione utenze, tipologie e aggregatori di utenze
      - Gestione fornitori e fatture collegate
      - Capitoli di bilancio e convenzioni CONSIP
      - Autenticazione JWT con OTP via email per reset password e bootstrap Admin
      - Documentazione API via Swagger
    screenshots:
      - docs/screenshots/01-login.png
      - docs/screenshots/02-dashboard.png
      - docs/screenshots/03-mappa.png
      - docs/screenshots/04-immobili.png
      - docs/screenshots/05-utenze.png

