# API risolta di continuo, non una volta sola all'avvio: un redeploy che ricrea solo il
# servizio `api` gli da' un IP nuovo (ComunicaPA, produzione 2026-11-04). `resolve`
# (nginx >= 1.27.3) ririsolve il nome alla scadenza del resolver; il resolver (DNS della
# rete dei container: Docker 127.0.0.11, podman aardvark-dns) lo scrive 20-runtime-config.sh.
include /tmp/runtime-config/resolver.conf;

upstream utenzepa_api {
    zone utenzepa_api 64k;
    server api:3000 resolve;
}

server {
    # nginx-unprivileged: niente porte < 1024.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Redirect relativi: dietro il proxy l'host e la porta interni (8080) non sono raggiungibili.
    absolute_redirect off;

    # Gestione SPA routing - tutte le route vengono reindirizzate a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API sulla stessa origin (niente CORS): /api/v1/... passa all'API cosi' com'e'.
    # Backup e allegati fino a qualche GB: niente buffering ne' su disco ne' in RAM (il
    # filesystem e' in sola lettura e /tmp e' un tmpfs), nessun limite di dimensione qui
    # (lo applicano l'API e BACKUP_MAX_SIZE_MB), timeout lunghi per backup e ripristino.
    # `^~`: precede la regex degli statici (foto e allegati dell'API finiscono in .jpg/.png).
    location ^~ /api/ {
        proxy_pass http://utenzepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Config runtime (generata dall'entrypoint a ogni avvio container in /tmp: filesystem
    # in sola lettura): mai in cache.
    location = /config.js {
        root /tmp/runtime-config;
        add_header Cache-Control "no-cache";
    }

    # index.html sempre rivalidato: punta ai bundle con hash (main-XXXX.js),
    # se resta in cache il browser continua a caricare la versione precedente
    # dopo un rilascio. Copre anche "/" e il fallback SPA (redirect interno).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache per static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Route SPA /guida: senza questa, try_files trova la cartella guida/ (il Markdown sotto)
    # e risponde 301 verso /guida/ invece di servire l'app (apertura diretta o ricarica).
    location = /guida {
        try_files /index.html =404;
    }

    # Guida operatori: Markdown servito così com'è (lo legge la pagina /guida e
    # lo importa CruscottoPA). Niente fallback su index.html: un file mancante
    # deve dare 404, non la SPA.
    location ^~ /guida/ {
        types {
            text/markdown md;
            image/png png;
            image/jpeg jpg jpeg;
            image/webp webp;
        }
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "no-cache";
    }

    # Sicurezza - disabilita accesso a file nascosti
    location ~ /\. {
        deny all;
    }
}
