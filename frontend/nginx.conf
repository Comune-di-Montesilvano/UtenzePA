server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Redirect relativi: dietro il proxy l'host e la porta interni (80) non sono raggiungibili.
    absolute_redirect off;

    # Gestione SPA routing - tutte le route vengono reindirizzate a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Config runtime (generata dall'entrypoint a ogni avvio container): mai in cache
    # index.html sempre rivalidato: punta ai bundle con hash (main-XXXX.js),
    # se resta in cache il browser continua a caricare la versione precedente
    # dopo un rilascio. Copre anche "/" e il fallback SPA (redirect interno).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # Cache per static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Route SPA /guida: senza questa, try_files trova la cartella guida/ (il Markdown sotto)
    # e risponde 301 verso /guida/ invece di servire l'app (apertura diretta o ricarica).
    location = /guida {
        try_files /index.html =404;
    }

    # Guida operatori: Markdown servito così com'è (lo legge la pagina /guida e
    # lo importa CruscottoPA). Niente fallback su index.html: un file mancante
    # deve dare 404, non la SPA.
    location ^~ /guida/ {
        types {
            text/markdown md;
            image/png png;
            image/jpeg jpg jpeg;
            image/webp webp;
        }
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "no-cache";
    }

    # Sicurezza - disabilita accesso a file nascosti
    location ~ /\. {
        deny all;
    }
}
