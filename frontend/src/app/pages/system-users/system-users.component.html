<div style="padding: 1rem;">
  <h1>Utenti e ruoli</h1>
  <p class="list-subtitle">Utenti del sistema e loro ruoli.</p>
  <app-list-filters [defs]="filterDefs" [values]="filterValues" placeholder="Cerca nome, email..."
                    (valuesChange)="onFiltersChange($event)" (quickSearch)="onQuickSearch($event)"></app-list-filters>
  <div style="margin-top: 1rem;">
    <app-data-table-users
      [data]="list"
      [loading]="loading"
      (onSave)="onSave($event)"
      (onDelete)="onDelete($event)"
      (onCreate)="onCreate($event)"
      [resetPagingTrigger]="resetPagingCount"
    ></app-data-table-users>
  </div>
</div>
