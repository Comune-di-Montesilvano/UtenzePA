<h2 mat-dialog-title>
  {{ isNew ? 'Nuova controparte' : 'Controparte: ' + data.item.name }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" [readOnly]="['Lettore']" style="display: flex; flex-direction: column; gap: 1rem;">
    <mat-form-field>
      <mat-label>Nome / ragione sociale *</mat-label>
      <input matInput formControlName="name" placeholder="Nome della controparte">
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <mat-error>Obbligatorio</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Codice fiscale / P. IVA</mat-label>
      <input matInput formControlName="tax_code" maxlength="16">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Contatti</mat-label>
      <textarea matInput formControlName="contacts" rows="2" placeholder="Telefono, email, referente"></textarea>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Descrizione</mat-label>
      <textarea matInput formControlName="description" rows="4" placeholder="Descrizione"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">Annulla</button>
  <button mat-flat-button (click)="save()" [disabled]="!form.valid" [appHasRole]="['Admin','Operatore']">Salva controparte</button>
</mat-dialog-actions>
