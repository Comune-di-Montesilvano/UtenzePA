<div [formGroup]="qSearch" class="p-fluid search-container" style="display: flex; align-items: center; gap: 0.5rem;">
  <div style="flex: 1;">
    <span class="p-input-icon-left" style="width: 100%;">
      <input
        type="text"
        pInputText
        placeholder="Cerca ..."
        formControlName="qsearch"
        (keyup.enter)="onQuickSearch()"
        style="width: 100%; height: 3rem;"
      >
    </span>
  </div>

  <button
    pButton
    class="p-button-outlined p-button-secondary"
    (click)="filterDialogVisible = true"
    style="height: 3rem;">
    <i pButtonIcon class="pi pi-filter"></i>
    <span pButtonLabel class="p-button-label">Filtri</span>
  </button>
</div>

<p-dialog
  header="Filtri Avanzati Utilizzatore"
  [(visible)]="filterDialogVisible"
  [modal]="true"
  [style]="{width: '700px'}"
  styleClass="max-w-screen-md"
>
  <form id="filter-form" [formGroup]="qSearch" (ngSubmit)="onSearch()" class="p-fluid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">

    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
      <label for="name">Nome</label>
      <input
        id="name"
        pInputText
        formControlName="name"
        placeholder=""
        style="width: 100%;"
      />
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
      <label for="description">Descrizione</label>
      <input
        id="description"
        pInputText
        formControlName="description"
        placeholder=""
        style="width: 100%;"
      />
    </div>

  </form>

  <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem; gap: 0.5rem;">
    <button pButton type="button" class="p-button-outlined p-button-secondary" (click)="onClear()">
      <i pButtonIcon class="pi pi-filter-slash"></i>
      <span pButtonLabel>Pulisci Filtri</span>
    </button>
    <button pButton type="submit" form="filter-form" class="p-button">
      <i pButtonIcon class="pi pi-search"></i>
      <span pButtonLabel>Applica Filtri</span>
    </button>
  </div>
</p-dialog>
