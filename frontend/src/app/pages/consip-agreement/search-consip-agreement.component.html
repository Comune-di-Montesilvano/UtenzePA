<!-- Barra principale -->
<div [formGroup]="qSearch" style="display: flex; align-items: center; gap: 0.5rem;">
  <div style="flex: 1;">
    <input
      type="text"
      pInputText
      placeholder="Cerca..."
      formControlName="qsearch"
      (keyup.enter)="onQuickSearch()"
      style="width: 100%; height: 3rem;">
  </div>

  <button
    pButton
    class="p-button-outlined p-button-secondary"
    (click)="filterDialogVisible = true"
    style="height: 3rem;">
    <i pButtonIcon class="pi pi-filter"></i>
    <span pButtonLabel class="p-button-label">Filtri</span>
  </button>
</div>

<p-dialog
  header="Filtri di ricerca"
  [(visible)]="filterDialogVisible"
  [modal]="true"
  [style]="{width: '31vw'}"
>
  <form id="filter-form" [formGroup]="qSearch" (ngSubmit)="onSearch()" class="p-fluid" style="display: flex; flex-wrap: wrap; gap: 1rem;">

    <div style="flex: 1 1 45%;">
      <label for="name">Nome</label>
      <input id="name" pInputText formControlName="name" style="width: 100%;">
    </div>

    <div style="flex: 1 1 45%;">
      <label for="cig_master">CIG Master</label>
      <input id="cig_master" pInputText formControlName="cig_master" style="width: 100%;">
    </div>

    <div style="flex: 1 1 45%;">
      <label for="description">Descrizione</label>
      <input id="description" pInputText formControlName="description" style="width: 100%;">
    </div>

    <div style="display: flex; gap: 1rem; width: 100%;">
      <div style="flex: 1; display: flex; flex-direction: column;">
        <label for="expiration_date_end" style="display: block;">Data scadenza</label>
        <p-datePicker
          id="expiration_date_end"
          formControlName="expiration_date_range"
          name="expiration_date_end"
          dateFormat="dd/mm/yy"
          placeholder="Da / A"
          [showIcon]="true"
          style="width: 100%;"
          [appendTo]="'body'"
          [minDate]="minEndDate"
          selectionMode="range"
          [showButtonBar]="true"
        />
      </div>
    </div>

    <div style="flex: 1 1 100%; overflow: hidden;">
      <label for="supplier_id">Fornitore</label>
      <p-select
        id="supplier_id"
        [options]="supplierOptions"
        formControlName="supplier_id"
        optionLabel="label"
        optionValue="value"
        placeholder="Seleziona Fornitore"
        [filter]="true"
        filterBy="label"
        [showClear]="true"
        style="width: 100%;"
        class="p-select-wide-wrap"
        [appendTo]="'body'"
      />
    </div>

    <div style="flex: 1 1 calc(25% - 0.75rem);">
      <label>Salvaguardia</label>
      <div style="display: flex; gap: 1rem; align-items: center; padding-top: 0.4rem;">
        <div style="display: flex; align-items: center; gap: 0.4rem;">
          <p-radioButton inputId="sfg_all" formControlName="safeguard" [value]="null"/>
          <label for="sfg_all">Tutti</label>
        </div>
        <div style="display: flex; align-items: center; gap: 0.4rem;">
          <p-radioButton inputId="sfg_yes" formControlName="safeguard" [value]="true"/>
          <label for="sfg_yes">Sì</label>
        </div>
        <div style="display: flex; align-items: center; gap: 0.4rem;">
          <p-radioButton inputId="sfg_no" formControlName="safeguard" [value]="false"/>
          <label for="sfg_no">No</label>
        </div>
      </div>
    </div>

  </form>

  <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem; gap: 0.5rem;">
    <button pButton type="button" class="p-button-outlined p-button-secondary" (click)="onClear()">
      <i pButtonIcon class="pi pi-filter-slash"></i>
      <span pButtonLabel>Pulisci Filtri</span>
    </button>
    <button pButton type="submit" form="filter-form" class="p-button">
      <i pButtonIcon class="pi pi-search"></i>
      <span pButtonLabel>Applica Filtri</span>
    </button>
  </div>
</p-dialog>
