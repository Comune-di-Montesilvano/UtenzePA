<div style="padding: 1rem;">
  <h1>Convenzioni CONSIP</h1>
  <p class="list-subtitle">Convenzioni quadro CONSIP e fornitori aggiudicatari.</p>
  <app-list-filters [defs]="filterDefs" [values]="filterValues" placeholder="Cerca nome, CIG master, descrizione..."
                    (valuesChange)="onFiltersChange($event)" (quickSearch)="onQuickSearch($event)"></app-list-filters>
  <div style="margin-top: 1rem;">
    <app-data-table-consip-agreement [data]="list"
      [loading]="loading"
      (onSave)="onSave($event)"
      (onDelete)="onDelete($event)"
      (onCreate)="onCreate($event)"
      (onRestore)="onRestore($event)"
      [resetPagingTrigger]="resetPagingCount"
    ></app-data-table-consip-agreement>
  </div>
</div>
