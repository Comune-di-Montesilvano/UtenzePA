<div style="padding: 1rem;">
  <h1>Immobili</h1>
  <p class="list-subtitle">Immobili comunali: classificazione, indirizzo, catasto, utenze e impianti collegati.</p>

  @if (legacyCount > 0) {
    <div style="margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 6px; background: #fef3c7; color: #92400e; display: flex; align-items: center; gap: 0.75rem;">
      <mat-icon>info</mat-icon>
      <span><strong>{{ legacyCount }}</strong> immobili da classificare (tipologia o funzione mancanti).</span>
      <button mat-stroked-button style="margin-left: auto;" (click)="showLegacyOnly()">Mostra</button>
    </div>
  }

  <app-list-filters [defs]="filterDefs" [values]="filterValues" placeholder="Cerca nome, indirizzo, toponimo..."
                    (valuesChange)="onFiltersChange($event)" (quickSearch)="onQuickSearch($event)"></app-list-filters>

  <div style="margin-top: 1rem;">
    <app-data-table-assets
      #dataTable
      [data]="list"
      [loading]="loading"
      (onSave)="onSave($event)"
      (onDelete)="onDelete($event)"
      (onCreate)="onCreate($event)"
      (onRestore)="onRestore($event)"
      [resetPagingTrigger]="resetPagingCount"
    ></app-data-table-assets>
  </div>
</div>
