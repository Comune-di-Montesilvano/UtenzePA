<div [formGroup]="qSearch" style="display: flex; align-items: center; gap: 0.5rem;">
  <div style="flex: 1;">
        <span class="p-input-icon-left" style="width: 100%;">
            <input
              type="text"
              pInputText
              placeholder="Cerca..."
              formControlName="qsearch"
              (keyup.enter)="onQuickSearch()"
              style="width: 100%; height: 3rem;"
            >
        </span>
  </div>

  <button
    pButton
    class="p-button-outlined p-button-secondary"
    (click)="filterDialogVisible = true"
    style="height: 3rem;">
    <i pButtonIcon class="pi pi-filter"></i>
    <span pButtonLabel class="p-button-label">Filtri</span>
  </button>
</div>

<p-dialog
  header="Filtri di ricerca Utenze"
  [(visible)]="filterDialogVisible"
  [modal]="true"
  [style]="{width: '1200px'}"
  styleClass="max-w-screen-xl">

  <style>
    .grid-container {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      width: 100%;
    }

    .grid-item {
      flex: 1 1 calc(25% - 1rem);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      overflow: hidden;
    }

    .grid-item p-select,
    .grid-item p-datepicker,
    .grid-item input {
      width: 100% !important;
    }
  </style>

  <form id="filter-form" [formGroup]="qSearch" (ngSubmit)="onSearch()"
        (keydown.enter)="$event.stopPropagation(); onSearch()" class="p-fluid"
        style="display: flex; flex-direction: column; gap: 1.5rem;">

    <p-fieldset legend="Identificazione" [toggleable]="true">
      <div class="grid-container">
        <div class="grid-item">
          <label style="font-weight: 500;">Codice (POD/PDR/Matricola)</label>
          <input pInputText formControlName="utility_id" placeholder="Es. IT001P...">
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Numero Contatore</label>
          <input pInputText formControlName="meter_number">
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Codice Utenza/Cliente</label>
          <input pInputText formControlName="utility_code">
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Tipo Utenza</label>
          <p-select [options]="utilityTypeOptions" formControlName="utility_type_id_fk" optionLabel="label"
                    optionValue="value" placeholder="Seleziona" [showClear]="true" [appendTo]="'body'"></p-select>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Fabbricato Associato</label>
          <p-select [options]="assetOptions" formControlName="asset_id_fk" optionLabel="label"
                    optionValue="value" placeholder="Seleziona" [showClear]="true" [filter]="true" filterBy="label"
                    [appendTo]="'body'"></p-select>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Aggregato</label>
          <p-select [options]="aggregatorOptions" formControlName="aggregator_id_fk" optionLabel="label"
                    optionValue="value" placeholder="Seleziona" [showClear]="true" [filter]="true" filterBy="label"
                    [appendTo]="'body'"></p-select>
        </div>
        <div class="grid-item" style="flex: 2 1 calc(50% - 1rem);">
          <label style="font-weight: 500;">Indirizzo Fornitura</label>
          <input pInputText formControlName="supplier_address">
        </div>
        <div style="display: flex; flex: 2 1 calc(50% - 1rem); gap: 1rem;">
          <div style="flex: 1 1 50%; display: flex; flex-direction: column; overflow: hidden;">
            <label style="font-weight: 500;">Latitudine</label>
            <input pInputText formControlName="latitude" placeholder="Es. 45.123">
          </div>
          <div style="flex: 1 1 50%; display: flex; flex-direction: column; overflow: hidden;">
            <label style="font-weight: 500;">Longitudine</label>
            <input pInputText formControlName="longitude" placeholder="Es. 9.123">
          </div>
        </div>
      </div>
    </p-fieldset>

    <p-fieldset legend="Caratteristiche Tecniche" [toggleable]="true">
      <div class="grid-container">
        <div class="grid-item">
          <label style="font-weight: 500;">Potenza (kW)</label>
          <input pInputText formControlName="power_kw_electric">
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Tensione (V / kV)</label>
          <input pInputText formControlName="voltage_kw_electric">
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Tipo Fase</label>
          <p-select [options]="phaseTypeOptions" formControlName="phase_type_electric" optionLabel="label"
                    optionValue="value" placeholder="Seleziona" [showClear]="true" [appendTo]="'body'"></p-select>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Disalimentabilità</label>
          <input pInputText formControlName="disconnection_ability">
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">WBS Gas</label>
          <input pInputText formControlName="wbs_gas_element">
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Tipo uso contatore</label>
          <input pInputText formControlName="meter_usage_type">
        </div>
      </div>
    </p-fieldset>

    <p-fieldset legend="Stato Utenza" [toggleable]="true">
      <div class="grid-container">
        <div class="grid-item">
          <label style="font-weight: 500;">Fornitura Attiva</label>
          <p-select [options]="booleanOptions" formControlName="supply_active" optionLabel="label" optionValue="value"
                    placeholder="Tutti" [showClear]="true" [appendTo]="'body'"></p-select>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Contatore Rimosso</label>
          <p-select [options]="booleanOptions" formControlName="meter_removed" optionLabel="label" optionValue="value"
                    placeholder="Tutti" [showClear]="true" [appendTo]="'body'"></p-select>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Contatore Verificato</label>
          <p-select [options]="booleanOptions" formControlName="meter_verified" optionLabel="label" optionValue="value"
                    placeholder="Tutti" [showClear]="true" [appendTo]="'body'"></p-select>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Stato Utenza</label>
          <p-select [options]="statusOption" formControlName="utilityState" optionLabel="label" optionValue="value"
                    placeholder="Tutti" [showClear]="true" [appendTo]="'body'"></p-select>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Voltura/Cessazione (Range)</label>
          <p-datePicker formControlName="takeover_termination_date_range" selectionMode="range" [showIcon]="true"
                        placeholder="Da / A" dateFormat="dd/mm/yy" [appendTo]="'body'"
                        showButtonBar="true"></p-datePicker>
        </div>
      </div>
    </p-fieldset>

    <p-fieldset legend="Dati Contrattuali" [toggleable]="true">
      <div class="grid-container">
        <div class="grid-item">
          <label style="font-weight: 500;">Convenzione CONSIP - Salvaguardia</label>
          <p-select [options]="safeguardOptions" formControlName="safeguard" optionLabel="label" optionValue="value"
                    placeholder="Seleziona" [showClear]="true" [appendTo]="'body'"></p-select>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Ordine CONSIP</label>
          <input pInputText formControlName="consip_order">
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Fornitore</label>
          <p-select [options]="supplierOptions" formControlName="supplier_id_fk" optionLabel="label"
                    optionValue="value" placeholder="Seleziona" [showClear]="true" [filter]="true" filterBy="label"
                    [appendTo]="'body'"></p-select>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Decorrenza (Range)</label>
          <p-datePicker formControlName="supply_start_date_range" selectionMode="range" [showIcon]="true"
                        placeholder="Da / A" dateFormat="dd/mm/yy" [appendTo]="'body'"></p-datePicker>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Scadenza Affid. (Range)</label>
          <p-datePicker formControlName="supply_expiry_date_range" selectionMode="range" [showIcon]="true"
                        placeholder="Da / A" dateFormat="dd/mm/yy" [appendTo]="'body'"
                        showButtonBar="true"></p-datePicker>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Gestione Manutenzione</label>
          <p-select [options]="managementOptions" formControlName="maintenance_management_id_fk" optionLabel="label"
                    optionValue="value" placeholder="Seleziona" [showClear]="true" [appendTo]="'body'"></p-select>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Scadenza Gest. (Range)</label>
          <p-datePicker formControlName="management_expiry_date_range" selectionMode="range" [showIcon]="true"
                        placeholder="Da / A" dateFormat="dd/mm/yy" [appendTo]="'body'"
                        showButtonBar="true"></p-datePicker>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Concessione Acqua (Range)</label>
          <p-datePicker formControlName="water_concession_range" selectionMode="range" [showIcon]="true"
                        placeholder="Da / A" dateFormat="dd/mm/yy" [appendTo]="'body'"
                        showButtonBar="true"></p-datePicker>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Costi a Carico di</label>
          <p-select [options]="costsBorneByOptions" formControlName="costs_borne_by_id_fk" optionLabel="label"
                    optionValue="value" placeholder="Seleziona" [showClear]="true" [appendTo]="'body'"></p-select>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">CIG Contratto</label>
          <input pInputText formControlName="cig_contract">
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Numero Ordine</label>
          <input pInputText formControlName="order_number">
        </div>
      </div>
    </p-fieldset>

    <p-fieldset legend="Consumi" [toggleable]="true">
      <div class="grid-container">
        <div class="grid-item">
          <label style="font-weight: 500;">Capitolo di Spesa</label>
          <p-select [options]="budgetChapterOptions" formControlName="budget_chapter_code_fk" optionLabel="label"
                    optionValue="value" placeholder="Seleziona" [showClear]="true" [appendTo]="'body'" [filter]="true"
                    filterBy="label"></p-select>
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Consumo Annuo Presunto</label>
          <input pInputText formControlName="estimated_annual_consumption">
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Consumo Annuo Comunicato Consip</label>
          <input pInputText formControlName="reported_consumption_year">
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Deposito Cauzionale</label>
          <p-inputNumber inputId="security_deposit" formControlName="security_deposit"
                         mode="currency" currency="EUR" locale="it-IT" fluid></p-inputNumber>
        </div>
      </div>
    </p-fieldset>

    <p-fieldset legend="Utilizzatori" [toggleable]="true">
      <div class="grid-container">
        <div class="grid-item">
          <label style="font-weight: 500;">Utilizzatore</label>
          <p-select [options]="utilizerOptions"
                    formControlName="user_id_fk"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Seleziona utilizzatore"
                    [filter]="true"
                    filterBy="label"
                    [showClear]="true"
                    [appendTo]="'body'">
          </p-select>
        </div>
      </div>
    </p-fieldset>

    <p-fieldset legend="Ricerca Testuale Avanzata" [toggleable]="true" [collapsed]="true">
      <div class="grid-container">
        <div class="grid-item">
          <label style="font-weight: 500;">Specifiche</label>
          <input pInputText formControlName="specifications">
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Note</label>
          <input pInputText formControlName="notes">
        </div>
        <div class="grid-item">
          <label style="font-weight: 500;">Note Aggiuntive</label>
          <input pInputText formControlName="additional_notes">
        </div>
      </div>
    </p-fieldset>
  </form>

  <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem; gap: 0.5rem;">
    <button pButton type="button" class="p-button-outlined p-button-secondary" (click)="onClear()">
      <i pButtonIcon class="pi pi-filter-slash"></i>
      <span pButtonLabel>Pulisci Filtri</span>
    </button>
    <button pButton type="submit" form="filter-form" class="p-button">
      <i pButtonIcon class="pi pi-search"></i>
      <span pButtonLabel>Applica Filtri</span>
    </button>
  </div>
</p-dialog>
