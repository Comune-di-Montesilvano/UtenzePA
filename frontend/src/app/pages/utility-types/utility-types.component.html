<div style="padding: 1rem;">
  <h1>Tipologie uso contatore</h1>
  <p class="list-subtitle">Tipi di utenza (acqua, luce, gas, connettività).</p>
  <app-list-filters [defs]="filterDefs" [values]="filterValues" placeholder="Cerca..."
                    (valuesChange)="onFiltersChange($event)" (quickSearch)="onQuickSearch($event)"></app-list-filters>
  <div style="margin-top: 1rem;">
    <app-data-table-utility-types [data]="list"
      [loading]="loading"
      (onSave)="onSave($event)"
      (onDelete)="onDelete($event)"
      (onCreate)="onCreate($event)"
      (onRestore)="onRestore($event)"
      [resetPagingTrigger]="resetPagingCount"
    ></app-data-table-utility-types>
  </div>
</div>
