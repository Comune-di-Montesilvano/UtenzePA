<div style="padding: 1rem;">
  <h1>Fatture</h1>
  <p class="list-subtitle">Fatture dei fornitori, righe per utenza e impegni.</p>

  <app-list-filters [defs]="filterDefs" [values]="filterValues" placeholder="Cerca numero, protocollo, note..."
                    (valuesChange)="onFiltersChange($event)" (quickSearch)="onQuickSearch($event)"></app-list-filters>

  <div style="margin-top: 1rem;">
    <app-data-table-invoices
      [data]="list"
      [loading]="loading"
      (onSave)="onSave($event)"
      (onDelete)="onDelete($event)"
      (onCreate)="onCreate($event)"
      (onRestore)="onRestore($event)"
      [resetPagingTrigger]="resetPagingCount"
    ></app-data-table-invoices>
  </div>
</div>
