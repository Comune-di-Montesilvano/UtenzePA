<div [formGroup]="qSearch" style="display: flex; align-items: center; gap: 0.5rem;">
  <div style="flex: 1;">
        <span class="p-input-icon-left" style="width: 100%;">
            <input
              type="text"
              pInputText
              placeholder="Cerca per testo libero (ID Fattura, Protocollo, Note...)"
              formControlName="qsearch"
              (keyup.enter)="onQuickSearch()"
              style="width: 100%; height: 3rem;"
            >
        </span>
  </div>

  <button
    pButton
    class="p-button-outlined p-button-secondary"
    (click)="filterDialogVisible = true"
    style="height: 3rem;">
    <i pButtonIcon class="pi pi-filter"></i>
    <span pButtonLabel class="p-button-label">Filtri</span>
  </button>
</div>

<p-dialog
  header="Filtri di ricerca Fatture"
  [(visible)]="filterDialogVisible"
  [modal]="true"
  [style]="{width: '1000px'}"
  styleClass="max-w-screen-xl"
>
  <form id="filter-form" [formGroup]="qSearch" (ngSubmit)="onSearch()" class="p-fluid" style="display: flex; flex-direction: column; gap: 1rem;">

    <div style="display: flex; flex-wrap: wrap; gap: 1rem;">

      <div
        style="flex: 1 1 calc(33.333% - 0.66rem); display: flex; flex-direction: column; gap: 1rem; overflow: hidden;">

        <div class="field-group">
          <label for="invoice_id">ID Fattura</label>
          <input
            id="invoice_id"
            pInputText
            formControlName="invoice_id"
            placeholder="ID univoco della fattura"
            style="width: 100%;"
          />
        </div>

        <div class="field-group">
          <label for="protocol_number">Numero Protocollo</label>
          <input
            id="protocol_number"
            pInputText
            formControlName="protocol_number"
            style="width: 100%;"
          />
        </div>

        <div class="field-group">
          <label for="net_amount_excl_vat">Importo Netto (Escl. IVA)</label>
          <p-inputnumber
            id="net_amount_excl_vat"
            formControlName="net_amount_excl_vat"
            placeholder="Ricerca per valore esatto"
            mode="decimal"
            locale="it-IT"
            [minFractionDigits]="0"
            [maxFractionDigits]="2"
            style="width: 100%;"
          ></p-inputnumber>
        </div>

        <div class="field-group">
          <label for="last_invoice_arrears">Morosità Ultima Fattura</label>
          <p-inputnumber
            id="last_invoice_arrears"
            formControlName="last_invoice_arrears"
            placeholder="Ricerca per valore esatto"
            mode="decimal"
            locale="it-IT"
            [minFractionDigits]="0"
            [maxFractionDigits]="2"
            style="width: 100%;"
          ></p-inputnumber>
        </div>
      </div>

      <div
        style="flex: 1 1 calc(33.333% - 0.66rem); display: flex; flex-direction: column; gap: 1rem; overflow: hidden;">

        <div class="field-group">
          <label for="utility_id_fk">Utenza Associata</label>
          <p-select
            id="utility_id_fk"
            [options]="utilityOptions"
            formControlName="utility_id_fk"
            optionLabel="label"
            optionValue="value"
            placeholder="Seleziona"
            [showClear]="true"
            style="width: 100%;"
            [appendTo]="'body'"
            [filter]="true"
          />
        </div>

        <div class="field-group">
          <label for="supplier_id_fk">Fornitore</label>
          <p-select
            id="supplier_id_fk"
            [options]="supplierOptions"
            formControlName="supplier_id_fk"
            optionLabel="label"
            optionValue="value"
            placeholder="Seleziona"
            [showClear]="true"
            style="width: 100%;"
            [appendTo]="'body'"
          />
        </div>

        <div class="field-group">
          <div style="flex: 1 1 100%; display: flex; flex-direction: column;">
            <label for="budget_chapter_ids" style="display: block; margin-bottom: 4px;">
              Capitoli di Spesa Associati
            </label>
            <p-multiSelect
              id="budget_chapter_ids"
              [options]="budgetChapterOptions"
              formControlName="budget_chapter_ids"
              optionLabel="label"
              optionValue="value"
              placeholder="Seleziona"
              [showClear]="true"
              style="width: 100%;"
              [appendTo]="'body'"
            />
          </div>
        </div>

      </div>

      <div
        style="flex: 1 1 calc(33.333% - 0.66rem); display: flex; flex-direction: column; gap: 1rem; overflow: hidden;">

        <div class="field-group">
          <label for="invoice_date_range">Data Fattura</label>
          <p-datePicker
            id="invoice_date_range"
            formControlName="invoice_date_range"
            dateFormat="dd/mm/yy"
            placeholder="Da / A"
            [showIcon]="true"
            style="width: 100%;"
            selectionMode="range"
            [appendTo]="'body'"
          />
        </div>

        <div style="margin-top: 1.5rem;">
          <label for="notes_on_invoices">Note su Fattura (Testuale)</label>
          <input id="notes_on_invoices" pInputText formControlName="notes_on_invoices" style="width: 100%;">
        </div>
      </div>

    </div>
  </form>

  <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem; gap: 0.5rem;">
    <button pButton type="button" class="p-button-outlined p-button-secondary" (click)="onClear()">
      <i pButtonIcon class="pi pi-filter-slash"></i>
      <span pButtonLabel>Pulisci Filtri</span>
    </button>
    <button pButton type="submit" form="filter-form" class="p-button">
      <i pButtonIcon class="pi pi-search"></i>
      <span pButtonLabel>Applica Filtri</span>
    </button>
  </div>
</p-dialog>
