<div style="padding: 1rem;">
  <h1>Capitoli di spesa</h1>
  <p class="list-subtitle">Capitoli del bilancio su cui gravano utenze e fatture.</p>
  <app-list-filters [defs]="filterDefs" [values]="filterValues" placeholder="Cerca codice, articolo, descrizione..."
                    (valuesChange)="onFiltersChange($event)" (quickSearch)="onQuickSearch($event)"></app-list-filters>
  <div style="margin-top: 1rem;">
    <app-data-table-budget-chapters
      [data]="list"
      [loading]="loading"
      (onSave)="onSave($event)"
      (onDelete)="onDelete($event)"
      (onCreate)="onCreate($event)"
      (onRestore)="onRestore($event)"
      [resetPagingTrigger]="resetPagingCount"
    ></app-data-table-budget-chapters>
  </div>
</div>
