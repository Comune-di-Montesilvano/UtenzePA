<app-list-toolbar [count]="data.length"
                  createLabel="Nuovo soggetto"
                  [columns]="allColumns"
                  [selectedColumns]="selectedColumns"
                  [compareColumns]="compareColumns"
                  (selectedColumnsChange)="selectedColumns = $event; onColumnsChange()"
                  (create)="openCreateDialog()"></app-list-toolbar>

@if (loading) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<table mat-table [dataSource]="dataSource" matSort #sort="matSort" class="mat-elevation-z1">

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Azioni</th>
    <td mat-cell *matCellDef="let item">
      <button mat-icon-button (click)="openEditDialog(item)" matTooltip="Apri" aria-label="Apri"
              [appHasRole]="['Admin', 'Operatore', 'Lettore']">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button
              [class.mat-action-success]="item.deleted"
              [class.mat-action-danger]="!item.deleted"
              [matTooltip]="item.deleted ? 'Ripristina' : 'Elimina'"
              [attr.aria-label]="item.deleted ? 'Ripristina' : 'Elimina'"
              (click)="item.deleted ? restoreItem(item) : openDeleteDialog(item)"
              [appHasRole]="['Admin', 'Operatore']">
        <mat-icon>{{ item.deleted ? 'restore' : 'delete' }}</mat-icon>
      </button>
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
    <td mat-cell *matCellDef="let item">{{ partyName(item) }}</td>
  </ng-container>

  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo</th>
    <td mat-cell *matCellDef="let item">{{ typeText(item) }}</td>
  </ng-container>

  <ng-container matColumnDef="identifier">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>P.IVA / CF</th>
    <td mat-cell *matCellDef="let item">{{ partyIdentifier(item) || '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="roles">
    <th mat-header-cell *matHeaderCellDef>Ruoli</th>
    <td mat-cell *matCellDef="let item">
      @for (b of roleBadges(item.roles); track b.label) {
        <app-status-badge [info]="b" size="sm"></app-status-badge>
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="city">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Città</th>
    <td mat-cell *matCellDef="let item">{{ item.city }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.row-deleted]="row.deleted"></tr>

  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" [attr.colspan]="displayedColumns.length">Nessun soggetto trovato.</td>
  </tr>
</table>

<mat-paginator #paginator [pageSizeOptions]="rowsPerPageOptions" [pageSize]="pageSize" showFirstLastButtons (page)="onPage($event)"></mat-paginator>
