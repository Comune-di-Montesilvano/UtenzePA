<div [formGroup]="qSearch" class="p-fluid search-container" style="display: flex; align-items: center; gap: 0.5rem;">
  <div style="flex: 1;">
    <span class="p-input-icon-left" style="width: 100%;">
      <input
        type="text"
        pInputText
        placeholder="Cerca per Nome Immobile, Nome Utilizzatore o Atto Concessione..."
        formControlName="qsearch"
        (keyup.enter)="onQuickSearch()"
        style="width: 100%; height: 3rem;"
      >
    </span>
  </div>

  <button
    pButton
    class="p-button-outlined p-button-secondary"
    (click)="filterDialogVisible = true"
    style="height: 3rem;">
    <i pButtonIcon class="pi pi-filter"></i>
    <span pButtonLabel class="p-button-label">Filtri</span>
  </button>
</div>

<p-dialog
  header="Filtri Avanzati Concessioni"
  [(visible)]="filterDialogVisible"
  [modal]="true"
  [style]="{width: '700px'}"
  styleClass="max-w-screen-md"
>
  <form id="filter-form" [formGroup]="qSearch" (ngSubmit)="onSearch()" class="p-fluid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">

    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
      <label for="asset_id_fk">Immobile</label>
      <p-select
        id="asset_id_fk"
        [options]="assetOptions"
        formControlName="asset_id_fk"
        optionLabel="label"
        optionValue="value"
        placeholder="Seleziona Immobile"
        style="width: 100%;"
        [filter]="true"
        filterBy="label"
        [showClear]="true"
        appendTo="body"
      />
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
      <label for="utilizer_id_fk">Utilizzatore</label>
      <p-select
        id="utilizer_id_fk"
        [options]="utilizerOptions"
        formControlName="utilizer_id_fk"
        optionLabel="label"
        optionValue="value"
        placeholder="Seleziona Utilizzatore"
        style="width: 100%;"
        [filter]="true"
        filterBy="label"
        [showClear]="true"
        appendTo="body"
      />
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
      <label for="usage_type">Tipo Utilizzo</label>
      <input
        id="usage_type"
        pInputText
        formControlName="usage_type"
        placeholder=""
        style="width: 100%;"
      />
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
      <label for="concession_act">Atto di Concessione</label>
      <input
        id="concession_act"
        pInputText
        formControlName="concession_act"
        placeholder=""
        style="width: 100%;"
      />
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
      <label for="grant_date">Data Concessione</label>
      <p-datePicker
        id="grant_date"
        formControlName="grant_date"
        dateFormat="dd/mm/yy"
        [showIcon]="true"
        placeholder="GG/MM/AAAA"
        style="width: 100%;"
        [appendTo]="'body'"
        [showButtonBar]="true"
      />
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
      <label for="expire_date">Data Scadenza</label>
      <p-datePicker
        id="expire_date"
        formControlName="expire_date"
        dateFormat="dd/mm/yy"
        [showIcon]="true"
        placeholder="GG/MM/AAAA"
        style="width: 100%;"
        [appendTo]="'body'"
        [showButtonBar]="true"
      />
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
      <label>Utenze da volturare</label>
      <div style="display: flex; gap: 1rem; align-items: center; padding-top: 0.4rem;">
        <div style="display: flex; align-items: center; gap: 0.4rem;">
          <p-radioButton inputId="utv_all" formControlName="utilities_to_be_taken_over" [value]="null"/>
          <label for="utv_all">Tutti</label>
        </div>
        <div style="display: flex; align-items: center; gap: 0.4rem;">
          <p-radioButton inputId="utv_yes" formControlName="utilities_to_be_taken_over" [value]="true"/>
          <label for="utv_yes">Sì</label>
        </div>
        <div style="display: flex; align-items: center; gap: 0.4rem;">
          <p-radioButton inputId="utv_no" formControlName="utilities_to_be_taken_over" [value]="false"/>
          <label for="utv_no">No</label>
        </div>
      </div>
    </div>

  </form>

  <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem; gap: 0.5rem;">
    <button pButton type="button" class="p-button-outlined p-button-secondary" (click)="onClear()">
      <i pButtonIcon class="pi pi-filter-slash"></i>
      <span pButtonLabel>Pulisci Filtri</span>
    </button>
    <button pButton type="submit" form="filter-form" class="p-button">
      <i pButtonIcon class="pi pi-search"></i>
      <span pButtonLabel>Applica Filtri</span>
    </button>
  </div>
</p-dialog>
