<div style="padding: 1rem;">
  <h1>Contratti immobiliari</h1>
  <p class="list-subtitle">Locazioni, concessioni, comodati e assegnazioni degli immobili comunali, attivi e passivi.</p>
  <app-list-filters [defs]="filterDefs" [values]="filterValues" placeholder="Cerca oggetto, parte, atto..."
                    (valuesChange)="onFiltersChange($event)" (quickSearch)="onQuickSearch($event)"
                    [extraChips]="signalChips" (extraChipRemoved)="clearSignal()"></app-list-filters>
  <app-list-signals [signals]="signals" [reloadToken]="signalsToken" [activeKey]="signal?.key ?? null"
                    (selected)="onSignal($event)"></app-list-signals>
  @let t = totals();
  <div style="display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 0.75rem; color: light-dark(#374151, #d4d4d8);">
    <span>Entrate annue: <strong>{{ euro(t.income) }}</strong></span>
    <span>Uscite annue: <strong>{{ euro(t.expense) }}</strong></span>
    <span>Saldo: <strong>{{ euro(t.income - t.expense) }}</strong></span>
    <span style="color: var(--app-muted); font-size: 0.85rem;">(contratti attivi o in scadenza tra quelli in elenco)</span>
  </div>
  <div style="margin-top: 1rem;">
    <app-data-table-utilizer-grant
      #dataTable
      [data]="list"
      [loading]="loading"
      (onSave)="onSave($event)"
      (onDelete)="onDelete($event)"
      (onCreate)="onCreate($event)"
      (onRestore)="onRestore($event)"
      [resetPagingTrigger]="resetPagingCount"
    ></app-data-table-utilizer-grant>
  </div>
</div>
