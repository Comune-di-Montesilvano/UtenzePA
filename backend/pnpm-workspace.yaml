overrides:
  '@opentelemetry/api': ^1.9.0
  '@opentelemetry/core': ^2.1.0
  '@opentelemetry/sdk-trace-base': ^2.1.0
  '@opentelemetry/sdk-metrics': ^2.1.0
  '@opentelemetry/sdk-logs': ^0.204.0
  '@opentelemetry/resources': ^2.1.0
  '@opentelemetry/otlp-transformer': ^0.204.0
  playwright: ^1.56.1
  serialize-javascript: ^7.0.2
  tar: ^7.5.0
  undici: ^7.19.0
allowBuilds:
  bcrypt: true
  protobufjs: true
  '@sentry/node-cpu-profiler': true
  unrs-resolver: true
  '@scarf/scarf': true
  '@playwright/browser-chromium': false
  unix-dgram: false
  # Watcher nativo di jest-haste-map per `jest --watch` — mai usato negli
  # script test:*/test:ci (nessuno passa --watch), sicuro da disabilitare.
  '@parcel/watcher': false
minimumReleaseAgeExclude:
  - nodemailer@9.0.6
