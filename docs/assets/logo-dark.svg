<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" width="100%" height="100%">
  <!-- SIMBOLO: Palazzo Governativo + Utenze (variante per tema scuro di logo.svg) -->
  <g transform="translate(15, 10)">

    <!-- Tetto (Timpano classico) -->
    <!-- Contorno esterno -->
    <!-- Variante scura: svuotamento interno con evenodd (trasparente) invece
         di un triangolo bianco sovrapposto -->
    <path d="M 80,0 L 0,40 H 160 Z M 80,8 L 18,34 H 142 Z" fill="#E7E7EA" fill-rule="evenodd" />

    <!-- Architrave -->
    <rect x="0" y="42" width="160" height="5" fill="#E7E7EA" rx="1" />

    <!-- 5 Pilastri strutturali (Grigio chiaro per non sovrastare le icone) -->
    <rect x="10" y="47" width="4" height="48" fill="#52525B" />
    <rect x="45" y="47" width="4" height="48" fill="#52525B" />
    <rect x="80" y="47" width="4" height="48" fill="#52525B" />
    <rect x="115" y="47" width="4" height="48" fill="#52525B" />
    <rect x="150" y="47" width="4" height="48" fill="#52525B" />

    <!-- Basamento (Gradinata) -->
    <rect x="0" y="95" width="160" height="5" fill="#E7E7EA" rx="1" />
    <rect x="-10" y="102" width="180" height="6" fill="#E7E7EA" rx="2" />

    <!-- ICONE UTENZE (infilate esattamente al centro delle 4 campate) -->

    <!-- 1. Acqua (Goccia - Blu) -->
    <svg x="17.5" y="59" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
    </svg>

    <!-- 2. Luce (Fulmine - Giallo) -->
    <svg x="52.5" y="59" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EAB308" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
    </svg>

    <!-- 3. Gas (Fiamma - Arancione) -->
    <svg x="87.5" y="59" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
    </svg>

    <!-- 4. Internet (Wi-Fi - Verde) -->
    <svg x="122.5" y="59" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12.55a11 11 0 0 1 14.08 0" />
      <path d="M1.42 9a16 16 0 0 1 21.16 0" />
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
      <circle cx="12" cy="20" r="1.5" fill="#10B981" stroke="#10B981" stroke-width="1" />
    </svg>
  </g>

  <!-- TESTO DEL LOGO -->
  <text x="210" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#E7E7EA" letter-spacing="-1">
    Utenze<tspan fill="#60A5FA" font-weight="300">PA</tspan>
  </text>

  <!-- SOTTOTITOLO (Opzionale, dà un tocco enterprise) -->
  <text x="215" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#9A9AA3" letter-spacing="5">
    GESTIONE PUBBLICA
  </text>
</svg>
