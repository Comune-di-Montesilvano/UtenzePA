name: OpenSSF Scorecard
# Punteggio pubblico delle pratiche di sicurezza del repo (branch protection, pin delle
# action, token, dependency update...): risultati nella tab Security e su
# https://scorecard.dev/viewer/?uri=github.com/Comune-di-Montesilvano/UtenzePA
# Struttura dal template ufficiale: con publish_results il workflow non deve avere
# env/defaults globali ne' step diversi da quelli ammessi.
on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      # Traffico in uscita registrato (audit, non bloccato): host nel log del post-step.
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif
          category: scorecard
