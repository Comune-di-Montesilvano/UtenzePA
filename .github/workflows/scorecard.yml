name: OpenSSF Scorecard
# Punteggio pubblico delle pratiche di sicurezza del repo (branch protection, pin delle
# action, token, dependency update...): risultati nella tab Security e su
# https://scorecard.dev/viewer/?uri=github.com/Comune-di-Montesilvano/UtenzePA
# Struttura dal template ufficiale: con publish_results il workflow non deve avere
# env/defaults globali ne' step diversi da quelli ammessi.
on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      # Traffico in uscita registrato (audit, non bloccato): host nel log del post-step.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: results.sarif
          category: scorecard
