# .github/workflows/tests.yml
name: Test

# Solo PR e merge queue: la coda prova lo stesso albero che finisce su main, un run su
# push di main sarebbe un doppione (il controllo assoluto giornaliero su main e' in
# security.yml).
on:
  pull_request:
    branches: [main]
  # Merge queue di main: i check girano sulla PR gia' unita a main prima del merge.
  merge_group:

# Cancella run precedenti sullo stesso branch/PR quando arriva un nuovo push -
# evita di sprecare minuti CI su commit gia' superati (push rapidi, force-push).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Dipendenze aggiunte o aggiornate dalla PR con advisory high/critical: PR ferma prima del
  # merge (Trivy vede solo cio' che finisce nelle immagini, qui anche le devDependencies).
  # Solo sulle PR: su push e merge queue il job risulta saltato.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Traffico in uscita registrato (audit, non bloccato): host contattati nel log del
      # post-step e nella pagina insights StepSecurity della run.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # pnpm dal campo packageManager (con hash) di backend/package.json: una sola fonte,
      # la stessa che corepack usa nei Dockerfile.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: backend/package.json

      # Le tre copie di packageManager (backend, frontend, e2e) devono coincidere.
      - name: Stessa versione di pnpm nei tre progetti
        working-directory: .
        run: |
          versions=$(for d in backend frontend e2e; do jq -r .packageManager "$d/package.json"; done | sort -u)
          echo "$versions"
          [ "$(printf '%s\n' "$versions" | wc -l)" -eq 1 ] || { echo "::error::packageManager diverso tra backend, frontend ed e2e"; exit 1; }

      # Major di Node dall'immagine base del backend (aggiornata da Dependabot): la CI
      # testa sulla stessa versione che gira in produzione.
      - name: Versione Node dall'immagine base
        id: node
        run: |
          major=$(sed -nE 's/^FROM node:([0-9]+)-.*/\1/p' Dockerfile | head -n1)
          [ -n "$major" ] || { echo "::error::FROM node:<major> non trovato in backend/Dockerfile"; exit 1; }
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # Senza --fix: in CI un errore correggibile fa fallire il job invece di sparire.
      - run: pnpm run lint:ci
      # tsc su tutto il progetto, spec compresi (nest build non li vede).
      - run: pnpm run type-check
      # Argomenti senza `--`: con pnpm 11 `pnpm run x -- a` passa `--` a jest, che tratta
      # gli argomenti come pattern di file (nessuna coverage, tutti i test).
      - run: pnpm run test:unit --coverage --coverageReporters=json-summary --coverageReporters=text-summary
      - name: Coverage nel summary
        run: node ../scripts/ci/coverage-summary.mjs backend coverage/coverage-summary.json
      - run: pnpm run build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Versione Node dall'immagine base
        id: node
        run: |
          major=$(sed -nE 's/^FROM node:([0-9]+)-.*/\1/p' ../backend/Dockerfile | head -n1)
          [ -n "$major" ] || { echo "::error::FROM node:<major> non trovato in backend/Dockerfile"; exit 1; }
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # Vitest su jsdom (builder @angular/build:unit-test): nessun browser. Reporter di
      # coverage in angular.json (text-summary, json-summary).
      - run: pnpm exec ng test --watch=false --coverage
      - name: Coverage nel summary
        run: node ../scripts/ci/coverage-summary.mjs frontend "$(find coverage -name coverage-summary.json | head -n1)"
      - run: pnpm run build

  # Build delle immagini di produzione come in release.yml (immagini base ripescate), poi
  # Trivy bloccante su CRITICAL/HIGH con fix disponibile: un'immagine base non piu'
  # aggiornata o una CVE nuova nelle dipendenze fermano la PR prima del tag, e il
  # rebuild giornaliero di latest non trova sorprese. Nessun push.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            target: production
          - app: frontend
            target: prod
          - app: tinn
            target: production
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.app }}
          file: ${{ matrix.app }}/Dockerfile
          target: ${{ matrix.target }}
          pull: true
          load: true
          # Stesso nome di docker-compose.yml con IMAGE_TAG=ci: il job e2e avvia lo stack di
          # produzione con queste immagini.
          tags: ghcr.io/comune-di-montesilvano/utenzepa-${{ matrix.app }}:ci
          # Package ghcr pubblico: la cache si legge senza login, mai scritta dalle PR.
          cache-from: type=registry,ref=ghcr.io/comune-di-montesilvano/utenzepa-${{ matrix.app }}:buildcache

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/comune-di-montesilvano/utenzepa-${{ matrix.app }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          # Versione fissa (nessun "latest"): trivy-version-check.yml apre una issue quando
          # ne esce una nuova.
          version: v0.76.1

      # Il container tinn non fa parte dello stack provato da e2e (profilo facoltativo).
      - name: Salva l'immagine per il job e2e
        if: matrix.app != 'tinn'
        run: docker save ghcr.io/comune-di-montesilvano/utenzepa-${{ matrix.app }}:ci | gzip -1 > image-${{ matrix.app }}.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.app != 'tinn'
        with:
          name: image-${{ matrix.app }}
          path: image-${{ matrix.app }}.tar.gz
          retention-days: 1

  # Container Tinn: test Python e selftest dell'estrazione su un DB Firebird finto
  # (tinn/testdata, nessun dato reale). Nessun collegamento SFTP in CI.
  tinn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build dello stage di test
        run: docker build --pull --target test -t utenzepa-tinn:test tinn

      - name: Test
        run: docker run --rm utenzepa-tinn:test python3 -m pytest -q

      - name: Selftest dell'estrazione
        run: docker run --rm utenzepa-tinn:test python3 -m app.selftest

  # Migration su un database vuoto (installazione nuova), entity allineate alle migration
  # (schema:log = solo la baseline nota) e giro down -> up di quelle aggiunte dalla PR.
  # Vedi backend/scripts/check-migrations.sh.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: mydatabase
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Storia completa: serve il confronto con la base per contare le migration nuove
          # (git diff locale, nessuna credenziale necessaria).
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: backend/package.json

      - name: Versione Node dall'immagine base
        id: node
        run: |
          major=$(sed -nE 's/^FROM node:([0-9]+)-.*/\1/p' Dockerfile | head -n1)
          [ -n "$major" ] || { echo "::error::FROM node:<major> non trovato in backend/Dockerfile"; exit 1; }
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Migration da zero, schema:log e down -> up
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci
          MYSQL_DB: mydatabase
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -eu
          # Migration aggiunte rispetto alla base (minimo 1: si prova sempre l'ultima).
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- src/database/migrations 2>/dev/null | grep -c '\.ts$' || true)
          echo "Migration nuove: ${added:-0}"
          sh scripts/check-migrations.sh "${added:-1}"

  # Stack di produzione (docker-compose.yml) con le immagini del job docker su un DB nuovo:
  # avvio, migration all'avvio, Admin creato via SQL, poi smoke Playwright (e2e/).
  e2e:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Valori usa e getta del solo CI, nessun segreto reale.
      IMAGE_TAG: ci
      MYSQL_PASSWORD: ci-mysql-password-not-secret
      JWT_ACCESS_SECRET: ci-jwt-secret-not-secret-0123456789abcdef0123456789abcdef
      COOKIE_SECRET: ci-cookie-secret-not-secret-0123456789abcdef0123456789abcdef
      SETUP_BOOTSTRAP_TOKEN: ci-setup-token-not-secret
      CORS_ORIGIN: http://localhost:4300
      API_URL: http://localhost:3000/api/v1
      INVOICE_IMPORT_DISABLED: 'true'
      E2E_USERNAME: e2e.admin
      E2E_PASSWORD: ci-e2e-password-not-secret
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true

      - name: Carica le immagini
        run: for f in image-*.tar.gz; do gunzip -c "$f" | docker load; done

      - name: Avvia lo stack di produzione
        run: |
          set -eu
          docker compose -f docker-compose.yml up -d --pull missing
          # Migration all'avvio su DB vuoto: l'API risponde solo a migration finite.
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/v1/health/liveness >/dev/null; then
              echo "API pronta dopo $((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "::error::API non pronta in 180 s"; exit 1

      - name: Crea l'Admin di prova
        run: |
          set -eu
          hash=$(docker compose -f docker-compose.yml exec -T -e P="$E2E_PASSWORD" api \
            node -e "require('bcrypt').hash(process.env.P, 10).then(console.log)")
          docker compose -f docker-compose.yml exec -T mysql mysql -uroot -p"$MYSQL_PASSWORD" mydatabase -e \
            "INSERT INTO system_users (first_name, last_name, username, password_hash, auth_provider, role, status, created_by_user_id, updated_by_user_id) VALUES ('E2E', 'Admin', '$E2E_USERNAME', '$hash', 'local', 'Admin', 'Attivo', -1, -1)"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: e2e/package.json

      - name: Versione Node dall'immagine base
        id: node
        run: |
          major=$(sed -nE 's/^FROM node:([0-9]+)-.*/\1/p' backend/Dockerfile | head -n1)
          [ -n "$major" ] || { echo "::error::FROM node:<major> non trovato in backend/Dockerfile"; exit 1; }
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: 'pnpm'
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test

      - name: Log dello stack
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --tail 300

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
