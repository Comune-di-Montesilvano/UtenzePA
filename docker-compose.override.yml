# SVILUPPO: attivato da COMPOSE_FILE=docker-compose.yml;docker-compose.override.yml
# in .env (Windows usa ";" come separatore, Linux/macOS usa ":"). Build in
# locale da Dockerfile (target development/dev), bind mount per hot-reload,
# porta MySQL e porta debug Node esposte.

services:

  mysql:
    ports:
      - '3307:3306'
    command: --skip-log-bin
    logging:
      driver: none

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      # Porte host non standard: 1025/8025 spesso già occupate da altri
      # progetti locali con mailpit proprio (es. comunicaPA). Le porte
      # interne al container restano 1025/8025 (vedi PORT_EMAIL sotto),
      # solo il mapping host cambia.
      - '1026:1025'
      - '8026:8025'
    networks:
      - utenzepa-network

  api:
    image: utenzepa/backend:dev
    build:
      context: ./backend
      target: development
      args:
        # Facoltativo — hash commit mostrato in sidebar al posto di 'dev':
        # VCS_REF=$(git rev-parse --short HEAD) docker compose up -d --build
        VCS_REF: ${VCS_REF:-}
    environment:
      - NODE_ENV=development
      - SWAGGER=true
      # In dev le email finiscono su mailpit (UI: http://localhost:8025), niente SMTP reale
      - HOST_EMAIL=mailpit
      - PORT_EMAIL=1025
      - SMTP_SECURE_PROTOCOL=false
      # Error tracking (Sentry/GlitchTip) — vuoto = disabilitato, valorizzabile
      # per testare l'invio eventi verso un'istanza locale/reale
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
      # Backup DB — schedulazione cron, retention, dimensioni massime
      - BACKUP_CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE:-0 0 * * *}
      - BACKUP_KEEP_DAILY=${BACKUP_KEEP_DAILY:-7}
      - BACKUP_KEEP_WEEKLY=${BACKUP_KEEP_WEEKLY:-4}
      - BACKUP_KEEP_MONTHLY=${BACKUP_KEEP_MONTHLY:-12}
      - BACKUP_KEEP_YEARLY=${BACKUP_KEEP_YEARLY:-0}
      - BACKUP_MAX_SIZE_MB=${BACKUP_MAX_SIZE_MB:-20480}
      # Import fatture dalla PEC dello SDI (IMAP in sola lettura) — host vuoto = non configurato
      - PEC_IMAP_HOST=${PEC_IMAP_HOST:-}
      - PEC_IMAP_PORT=${PEC_IMAP_PORT:-993}
      - PEC_IMAP_TLS=${PEC_IMAP_TLS:-true}
      - PEC_IMAP_USER=${PEC_IMAP_USER:-}
      - PEC_IMAP_PASSWORD=${PEC_IMAP_PASSWORD:-}
      - INVOICE_IMPORT_CRON=${INVOICE_IMPORT_CRON:-*/15 * * * *}
      # In dev spento: il DB locale non deve leggere la casella di produzione per sbaglio
      - INVOICE_IMPORT_DISABLED=${INVOICE_IMPORT_DISABLED:-true}
      - ACCOUNTING_IMPORT_DISABLED=${ACCOUNTING_IMPORT_DISABLED:-false}
      # HOME di default nell'immagine punta a /root (build-time, utente root) —
      # con user:"1000:1000" a runtime pnpm risolve lo store in $HOME/.local/share/pnpm,
      # cioè dentro /root, non scrivibile da uid 1000 (permessi 700 di default):
      # "attempt to write a readonly database" su ogni pnpm install/start:dev,
      # crash-loop del container. HOME esplicito su un path scrivibile dall'utente
      # 1000 (bind-mount del sorgente, owned correttamente) risolve alla radice.
      - HOME=/usr/src/app
    user: "1000:1000"
    volumes:
      - ./backend:/usr/src/app
      - ./backend/backups:/usr/src/app/backups
      - ./backend/photos:/usr/src/app/photos
      - ./backend/attachments:/usr/src/app/attachments
      - api_node_modules:/usr/src/app/node_modules
    ports:
      - '9229:9229'

  frontend:
    image: utenzepa/frontend:dev
    build:
      context: ./frontend
      target: dev
    environment:
      # `ng serve` non passa da nginx (niente 20-runtime-config.sh) — genera
      # public/config.js in dev con lo stesso meccanismo (vedi
      # frontend/docker/dev-runtime-config.sh), altrimenti il fallback statico
      # in environment.ts (porta 3000) non segue DOCKER_API_PORT se cambiato
      # per conflitti locali con altri progetti.
      - API_URL=http://localhost:${DOCKER_API_PORT:-3000}/api/v1
    ports: !override
      - '${DOCKER_FRONTEND_PORT:-4300}:4300'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  api_node_modules:
  frontend_node_modules:
