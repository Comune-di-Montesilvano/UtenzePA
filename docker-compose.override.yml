# SVILUPPO: attivato da COMPOSE_FILE=docker-compose.yml;docker-compose.override.yml
# in .env (Windows usa ";" come separatore, Linux/macOS usa ":"). Build in
# locale da Dockerfile (target development/dev), bind mount per hot-reload,
# porta MySQL e porta debug Node esposte.

services:

  mysql:
    ports:
      - '3307:3306'
    command: --skip-log-bin
    logging:
      driver: none

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      # Porte host non standard: 1025/8025 spesso già occupate da altri
      # progetti locali con mailpit proprio (es. comunicaPA). Le porte
      # interne al container restano 1025/8025 (vedi PORT_EMAIL sotto),
      # solo il mapping host cambia.
      - '1026:1025'
      - '8026:8025'
    networks:
      - utenzepa-network

  api:
    image: utenzepa/backend:dev
    build:
      context: ./backend
      target: development
      args:
        # Facoltativo — hash commit mostrato in sidebar al posto di 'dev':
        # VCS_REF=$(git rev-parse --short HEAD) docker compose up -d --build
        VCS_REF: ${VCS_REF:-}
    environment:
      - NODE_ENV=development
      - SWAGGER=true
      # In dev le email finiscono su mailpit (UI: http://localhost:8025), niente SMTP reale
      - HOST_EMAIL=mailpit
      - PORT_EMAIL=1025
      - SMTP_SECURE_PROTOCOL=false
      # Error tracking (Sentry/GlitchTip) — vuoto = disabilitato, valorizzabile
      # per testare l'invio eventi verso un'istanza locale/reale
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
      # Backup DB — schedulazione cron, retention, dimensioni massime
      - BACKUP_CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE:-0 0 * * *}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_MAX_SIZE_MB=${BACKUP_MAX_SIZE_MB:-500}
      - IMPORT_MAX_SIZE_MB=${IMPORT_MAX_SIZE_MB:-50}
    user: "1000:1000"
    volumes:
      - ./backend:/usr/src/app
      - ./backend/backups:/usr/src/app/backups
      - api_node_modules:/usr/src/app/node_modules
    ports:
      - '9229:9229'

  frontend:
    image: utenzepa/frontend:dev
    build:
      context: ./frontend
      target: dev
    environment:
      # `ng serve` non passa da nginx (niente 20-runtime-config.sh) — genera
      # public/config.js in dev con lo stesso meccanismo (vedi
      # frontend/docker/dev-runtime-config.sh), altrimenti il fallback statico
      # in environment.ts (porta 3000) non segue DOCKER_API_PORT se cambiato
      # per conflitti locali con altri progetti.
      - API_URL=http://localhost:${DOCKER_API_PORT:-3000}/api/v1
    ports: !override
      - '${DOCKER_FRONTEND_PORT:-4300}:4300'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  api_node_modules:
  frontend_node_modules:
